<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ConnectWise Control · Login</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="login-page">
    <header class="login-corner" aria-label="ConnectWise Control">
      <span class="screenconnect-mark" aria-hidden="true"></span>
    </header>

    <main class="login-stage">
      <form id="loginForm" class="login-card" autocomplete="on">
        <div class="login-brand">
          <span class="screenconnect-mark small" aria-hidden="true"></span>
          <span>ConnectWise Control</span>
        </div>

        <h1>Access your account</h1>
        <p>You have been logged out of the system. Please log in to continue.</p>

        <label class="sr-only" for="username">Username</label>
        <input id="username" name="username" autocomplete="username" placeholder="technician@example.com">

        <label class="sr-only" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password">

        <a id="forgotPassword" class="forgot-link" href="#" aria-label="Forgot password">Forgot password?</a>
        <p id="loginError" class="login-error" role="alert" hidden></p>

        <button class="login-button" type="submit">Login</button>

        <p style="text-align: center; margin-top: 24px; font-size: 12px; opacity: 0.6; color: #fff;">
          Are you a customer? <a href="/" style="color: #25bfc1; text-decoration: none; font-weight: bold;">Join a session</a>
        </p>

        <section id="resetPanel" class="reset-panel" hidden>
          <h2>Reset password</h2>
          <button id="sendResetCode" class="login-button" type="button">Send code</button>

          <label class="sr-only" for="resetCode">One-time code</label>
          <input id="resetCode" inputmode="numeric" autocomplete="one-time-code" placeholder="One-time code">

          <label class="sr-only" for="newPassword">New password</label>
          <input id="newPassword" type="password" autocomplete="new-password" placeholder="New password">
          <button id="confirmReset" class="login-button" type="button">Reset password</button>
          <p id="resetMessage" class="login-error" role="status" hidden></p>
        </section>
      </form>
    </main>

    <script>
      const form = document.querySelector('#loginForm');
      const error = document.querySelector('#loginError');
      const forgot = document.querySelector('#forgotPassword');
      const resetPanel = document.querySelector('#resetPanel');
      const resetCode = document.querySelector('#resetCode');
      const newPassword = document.querySelector('#newPassword');
      const sendResetCode = document.querySelector('#sendResetCode');
      const confirmReset = document.querySelector('#confirmReset');
      const resetMessage = document.querySelector('#resetMessage');

      function showResetMessage(text, isError = false) {
        resetMessage.textContent = text;
        resetMessage.style.color = isError ? '#b42318' : '#d8f5f5';
        resetMessage.hidden = false;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.hidden = true;
        const formData = new FormData(form);
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: formData.get('username'),
            password: formData.get('password')
          })
        });

        if (!response.ok) {
          error.textContent = 'Invalid username or password.';
          error.hidden = false;
          return;
        }

        window.location.href = '/Host';
      });

      forgot.addEventListener('click', (event) => {
        event.preventDefault();
        resetPanel.hidden = !resetPanel.hidden;
        resetMessage.hidden = true;
        if (!resetPanel.hidden) {
          sendResetCode.click();
          resetCode.focus();
        }
      });

      sendResetCode.addEventListener('click', async () => {
        resetMessage.hidden = true;
        sendResetCode.disabled = true;
        const response = await fetch('/api/password-reset/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });
        sendResetCode.disabled = false;
        if (!response.ok) {
          showResetMessage('Could not send reset code.', true);
          return;
        }
        showResetMessage('If this email is registered, a one-time code has been sent.');
      });

      confirmReset.addEventListener('click', async () => {
        resetMessage.hidden = true;
        confirmReset.disabled = true;
        const response = await fetch('/api/password-reset/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code: resetCode.value,
            password: newPassword.value
          })
        });
        const data = await response.json().catch(() => ({}));
        confirmReset.disabled = false;
        if (!response.ok) {
          showResetMessage(data.error || 'Could not reset password.', true);
          return;
        }
        showResetMessage('Password reset. You can log in with the new password.');
        resetCode.value = '';
        newPassword.value = '';
      });
    </script>
    <script src="/webmcp.js" type="module"></script>
  </body>
</html>
