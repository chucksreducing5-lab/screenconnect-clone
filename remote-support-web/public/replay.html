<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session Recordings — Replay</title>
  <link rel="stylesheet" href="/admin-theme.css">
  <style>
    .rp-wrap { display:grid; grid-template-columns: 320px 1fr; gap:16px; padding:16px; height:calc(100vh - 0px); box-sizing:border-box; }
    .rp-panel { background:var(--sc-bg2,#12232b); border:1px solid var(--sc-border,#1f3b44); border-radius:8px; padding:14px; overflow:auto; }
    .rp-title { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--sc-text-dim,#7fa6b0); margin-bottom:12px; }
    .rp-item { padding:10px 12px; border:1px solid var(--sc-border,#1f3b44); border-radius:6px; margin-bottom:8px; cursor:pointer; transition: background-color .15s ease, border-color .15s ease; }
    .rp-item:hover { border-color:var(--sc-teal,#1da7a5); }
    .rp-item.active { background:rgba(29,167,165,.12); border-color:var(--sc-teal,#1da7a5); }
    .rp-item .code { font-weight:700; color:var(--sc-text-bright,#eaf6f8); }
    .rp-item .meta { font-size:11px; color:var(--sc-text-dim,#7fa6b0); margin-top:4px; }
    .rp-live { display:inline-block; font-size:10px; color:#ff6b6b; margin-left:6px; }
    .rp-stage { display:flex; flex-direction:column; height:100%; }
    .rp-screen { flex:1; background:#000; border-radius:6px; display:flex; align-items:center; justify-content:center; overflow:hidden; min-height:0; }
    .rp-screen img { max-width:100%; max-height:100%; object-fit:contain; }
    .rp-controls { display:flex; align-items:center; gap:12px; padding-top:12px; }
    .rp-controls button { background:var(--sc-teal,#1da7a5); color:#00161a; border:none; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer; }
    .rp-controls button.ghost { background:transparent; color:var(--sc-text-bright,#eaf6f8); border:1px solid var(--sc-border,#1f3b44); }
    .rp-controls input[type=range] { flex:1; }
    .rp-empty { color:var(--sc-text-dim,#7fa6b0); font-size:13px; text-align:center; padding:24px; }
    .rp-status { font-size:12px; color:var(--sc-text-dim,#7fa6b0); margin-top:8px; }
  </style>
</head>
<body>
  <div class="rp-wrap">
    <div class="rp-panel" data-testid="recordings-list-panel">
      <div class="rp-title">Recordings</div>
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:12px;">
        <span style="font-size:11px;color:var(--sc-text-dim,#7fa6b0);">Delete older than</span>
        <input type="number" id="pruneDays" min="1" value="30" data-testid="prune-days" style="width:56px;padding:4px 6px;border-radius:6px;background:transparent;color:inherit;border:1px solid var(--sc-border,#1f3b44);">
        <span style="font-size:11px;color:var(--sc-text-dim,#7fa6b0);">days</span>
        <button id="pruneBtn" data-testid="prune-btn" style="margin-left:auto;background:transparent;color:#ff8a8a;border:1px solid #6b2b2b;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px;">Prune</button>
      </div>
      <div id="recordingsList"><div class="rp-empty">Loading…</div></div>
    </div>
    <div class="rp-panel rp-stage">
      <div class="rp-title" id="playerTitle">Select a recording to replay</div>
      <div class="rp-screen" data-testid="replay-screen"><img id="frameImg" alt="frame" style="display:none;"></div>
      <div class="rp-controls">
        <button id="btnPlay" data-testid="replay-play-btn" disabled>▶ Play</button>
        <button id="btnRestart" class="ghost" data-testid="replay-restart-btn" disabled>⟲ Restart</button>
        <input type="range" id="seek" min="0" max="0" value="0" data-testid="replay-seek" disabled>
        <select id="speed" class="ghost" data-testid="replay-speed" style="padding:8px;border-radius:6px;background:transparent;color:inherit;border:1px solid var(--sc-border,#1f3b44);">
          <option value="1">1×</option><option value="2">2×</option><option value="4">4×</option>
        </select>
      </div>
      <div class="rp-status" id="replayStatus"></div>
    </div>
  </div>
  <script src="/replay.js"></script>
</body>
</html>
